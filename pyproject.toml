[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projectbuilder"
version = "0.1.0"
description = "Framework para geração automatizada de projetos Python a partir de uma arquitetura declarativa."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

authors = [
    { name = "ProjectBuilder Team" }
]

keywords = [
    "generator",
    "project",
    "builder",
    "automation",
    "python",
    "templates"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

dependencies = [
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "rich>=13.0",
    "click>=8.1",
    "pydantic>=2.8",
    "networkx>=3.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "black>=24.0",
    "ruff>=0.6",
    "isort>=5.13",
    "mypy>=1.10"
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5"
]

[project.scripts]
projectbuilder = "builder.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = [
    "builder*"
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
python_files = [
    "test_*.py"
]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true
strict = true
